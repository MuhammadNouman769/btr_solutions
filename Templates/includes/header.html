{% load static %}

<style>
  /* ================= HEADER ================= */
  .header {
    position: fixed;
    width: 100%;
    top: 0;
    left: 0;
    z-index: 999;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(0,0,0,0.05);
    transition: 0.3s ease;
  }

  .header.sticky {
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    background: rgba(255,255,255,0.95);
  }

  /* ================= CONTAINER ================= */
  .container {
    max-width: 1200px;
    margin: auto;
    padding: 15px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* ================= NAV ================= */
  .nav-list {
    display: flex;
    gap: 28px;
    list-style: none;
    align-items: center;
  }

  .nav-list li a {
    font-size: 15px!important;
    font-weight: 500!important;
    color: #1f2937!important;
    text-decoration: none;
    position: relative;
    transition: 0.3s;
  }

  .nav-list li a:hover {
    color: #0be1cd;
  }

  /* underline hover */
  .nav-list li a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -6px;
    width: 0%;
    height: 2px;
    background: #0be1cd;
    transition: 0.3s;
  }

  .nav-list li a:hover::after {
    width: 100%;
  }

  /* ================= DROPDOWN ================= */
  .dropdown {
    position: relative;
  }

  .dropdown-menu {
    position: absolute;
    top: 110%;
    left: 0;
    background: #fff;
    min-width: 210px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    padding: 10px 0;

    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: 0.25s ease;
  }

  .dropdown:hover .dropdown-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .dropdown-menu li {
    padding: 10px 15px;
  }

  .dropdown-menu li a {
    font-size: 14px;
    color: #374151;
    display: block;
    transition: 0.2s;
  }

  .dropdown-menu li a:hover {
    color: #0be1cd;
    padding-left: 6px;
  }

  /* ================= BUTTONS ================= */
  .auth-buttons {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .btn-outline-header {
    padding: 9px 16px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    color: #111!important;
    text-decoration: none;
    font-size: 14px;
    transition: 0.3s;
  }

  .btn-outline:hover {
    background:rgb(243, 246, 246);
  }

  .btn-primary-header {
    padding: 9px 16px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    color: #111111d6!important;
    text-decoration: none;
    font-size: 10px;
    background:unset;
    transition: 0.3s;
  }
  .btn-primary:hover {
    background:rgb(243, 246, 246)!important;
  }

  

  /* ================= MOBILE ================= */
  .menu-btn {
    display: none;
    font-size: 22px;
    cursor: pointer;
  }

  @media (max-width: 768px) {
    .nav-list {
      display: none;
      position: absolute;
      top: 70px;
      left: 0;
      width: 100%;
      flex-direction: column;
      background: rgb(142, 129, 129);
      padding: 20px;
      gap: 15px;
    }

    nav.open .nav-list {
      display: flex;
    }

    .menu-btn {
      display: block;
    }
  }
</style>


<body>


<!-- ================= HEADER ================= -->
<header class="header">

  <div class="container">

    <!-- LOGO -->
    <a href="{% url 'home' %}">
      <img src="{% static 'images/btr.svg' %}" style="height:40px;">
    </a>

    <!-- NAV -->
    <nav>

      <ul class="nav-list">

        <li><a href="{% url 'home' %}">Home</a></li>
        <li><a href="{% url 'about_us' %}">About</a></li>

        <!-- SERVICES DROPDOWN -->
        <li class="dropdown">
          <a href="#!">Services ▼</a>

          <ul class="dropdown-menu">
            <li><a href="#">Web Development</a></li>
            <li><a href="#">App Development</a></li>
            <li><a href="#">DevOps & Cloud</a></li>
            <li><a href="#">UI/UX Design</a></li>
          </ul>
        </li>

        <li><a href="{% url 'case_studies' %}">Case Studies</a></li>
        <li><a href="{% url 'blog' %}">Blog</a></li>
        <li><a href="{% url 'contact_us' %}">Contact US</a></li>

      </ul>

    </nav>

    <!-- BUTTONS -->
    <div class="auth-buttons">

      <a href="signin.html" class="btn-outline-header">Sign In</a>

      <a href="signup.html" class="btn-primary-header">Get Started</a>

    </div>

    <!-- MOBILE -->
    <div class="menu-btn">☰</div>

  </div>

</header>

</body>
</html>
